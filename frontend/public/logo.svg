<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Tech Dark Blue Background Gradient -->
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Vibrant Cyan-Blue Glowing Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Pin 3D Gradient -->
    <linearGradient id="glossyPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="35" y="35" width="430" height="430" rx="110" fill="url(#techBg)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />

  <!-- Decorative Tech Radar Waves / Orbit Circles -->
  <circle cx="250" cy="230" r="140" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-dasharray="8 8" stroke-width="2" />
  <circle cx="250" cy="230" r="105" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Glowing Outer Ring -->
  <circle cx="250" cy="230" r="75" fill="none" stroke="url(#ringGrad)" stroke-width="6" filter="url(#neonGlow)" opacity="0.8" />

  <!-- Central 3D Location Pin -->
  <path d="M250 120 C202.5 120 164 158.5 164 206 C164 267.5 250 350 250 350 C250 350 336 267.5 336 206 C336 158.5 297.5 120 250 120 Z" 
        fill="url(#glossyPin)" 
        filter="url(#neonGlow)" />

  <!-- Inner Core White Circle -->
  <circle cx="250" cy="200" r="45" fill="#ffffff" />

  <!-- Precision Navigation Crosshair / Compass -->
  <g transform="translate(250, 200)">
    <!-- Vertical Arrow -->
    <polygon points="0,-28 8,8 0,3 0,-28" fill="#2563eb" />
    <polygon points="0,-28 -8,8 0,3 0,-28" fill="#38bdf8" />
    <!-- Horizontal Cross -->
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <!-- Center Dot -->
    <circle cx="0" cy="0" r="5" fill="#0f172a" />
  </g>

  <!-- University / Campus Horizon Base Line -->
  <path d="M160 405 L340 405" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M200 422 L300 422" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" />

  <!-- Sparkle Accent Elements -->
  <circle cx="360" cy="110" r="4" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="130" cy="330" r="3" fill="#60a5fa" filter="url(#neonGlow)" />
</svg>
